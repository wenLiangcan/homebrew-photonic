name: Test Cask

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Check out tap
        uses: actions/checkout@v6

      - name: Audit Cask
        run: |
          brew style Casks/photonic.rb
          brew tap wenliangcan/photonic "$GITHUB_WORKSPACE"
          brew audit --cask --strict wenliangcan/photonic/photonic
